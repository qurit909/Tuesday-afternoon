<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 경영 실적 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CSV 파싱을 위한 PapaParse 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.5s; }
    </style>
</head>
<body class="p-4 md:p-10">
    <!-- 로딩 화면 -->
    <div id="loading" class="loading-overlay">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
            <p class="mt-4 text-slate-500 font-medium">구글 시트에서 데이터를 불러오는 중...</p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- 상단 헤더 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 border-b pb-6 border-slate-200">
            <div>
                <h1 class="text-3xl font-black text-slate-900 flex items-center">
                    <span class="bg-green-600 text-white p-2 rounded-lg mr-3">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </span>
                    Live 실적 시각화 리포트
                </h1>
                <p class="text-slate-500 mt-1 font-medium">구글 시트와 실시간 동기화됨</p>
            </div>
            <div class="mt-4 md:mt-0">
                <button onclick="updateData()" class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-50 transition">
                    데이터 새로고침 ↻
                </button>
            </div>
        </div>

        <!-- 메인 요약 차트 그리드 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <!-- 매출 현황 -->
            <div class="card p-6 border-l-4 border-blue-500">
                <h3 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">Revenue Trend</h3>
                <div class="chart-container"><canvas id="financeChart"></canvas></div>
                <div class="mt-4"><p class="text-xs text-slate-400">최신 매출액</p><p id="val-revenue" class="text-xl font-black text-blue-600">-</p></div>
            </div>

            <!-- 주가 추이 -->
            <div class="card p-6 border-l-4 border-slate-800">
                <h3 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">Stock Price</h3>
                <div class="chart-container"><canvas id="stockChart"></canvas></div>
                <div class="mt-4"><p class="text-xs text-slate-400">현재 주가</p><p id="val-stock" class="text-xl font-black text-slate-800">-</p></div>
            </div>

            <!-- 재고 위험 -->
            <div class="card p-6 border-l-4 border-orange-500">
                <h3 class="text-sm font-bold text-slate-400 mb-4 uppercase tracking-wider">Inventory Level</h3>
                <div class="chart-container"><canvas id="inventoryChart"></canvas></div>
                <div class="mt-4"><p class="text-xs text-slate-400">기말 재고량</p><p id="val-inventory" class="text-xl font-black text-orange-600">-</p></div>
            </div>
        </div>

        <!-- 운영 지표 및 인사 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="card p-8">
                <h3 class="text-lg font-bold mb-6 flex items-center">핵심 성과 지표 (KPI)</h3>
                <div class="space-y-6" id="kpi-container">
                    <!-- JS에서 동적 생성 -->
                    로딩 중...
                </div>
            </div>

            <div class="card p-8 bg-slate-900 text-white">
                <h3 class="text-lg font-bold mb-6 text-slate-300">Personnel & Operations</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="p-3 bg-slate-800 rounded-xl">
                            <p class="text-[10px] text-slate-400 uppercase">순이익</p>
                            <p id="val-profit" class="text-lg font-bold">-</p>
                        </div>
                        <div class="p-3 bg-slate-800 rounded-xl">
                            <p class="text-[10px] text-slate-400 uppercase">퇴직 인원</p>
                            <p id="val-quit" class="text-lg font-bold">-</p>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center items-center p-4 bg-blue-600 border border-blue-500 rounded-2xl">
                        <p class="text-[10px] text-blue-100 uppercase font-bold">영업 인력</p>
                        <p id="val-salesforce" class="text-3xl font-black my-1">-</p>
                        <p class="text-[10px] text-blue-200 uppercase">Total Personnel</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 여기에 구글 시트 CSV URL을 입력하세요 (파일 > 공유 > 웹에 게시 > CSV)
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv'; 

        let charts = {};

        // 차트 초기화
        function initCharts() {
            const ctxFinance = document.getElementById('financeChart').getContext('2d');
            charts.finance = new Chart(ctxFinance, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: '매출액', data: [], backgroundColor: '#3b82f6', borderRadius: 8 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxStock = document.getElementById('stockChart').getContext('2d');
            charts.stock = new Chart(ctxStock, {
                type: 'line',
                data: { labels: [], datasets: [{ data: [], borderColor: '#1e293b', tension: 0.3, fill: false, pointRadius: 5 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxInventory = document.getElementById('inventoryChart').getContext('2d');
            charts.inventory = new Chart(ctxInventory, {
                type: 'doughnut',
                data: { labels: ['기타', '재고'], datasets: [{ data: [0, 0], backgroundColor: ['#f1f5f9', '#ea580c'] }] },
                options: { maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } }
            });
        }

        // 데이터 업데이트 로직
        async function updateData() {
            if (SHEET_CSV_URL.includes('https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv')) {
                // 샘플 데이터 (URL 미입력 시 시뮬레이션 용도)
                console.warn("구글 시트 URL이 설정되지 않았습니다. 샘플 데이터를 사용합니다.");
                renderData([
                    {분기: '3Y 4Q', 매출액: 886, 순이익: 41, 주가: 5774, 재고: 21677, RD: 50, 브랜드: 41, 원가: 361523, 판관비: 366, 퇴직: 52, 영업: 562},
                    {분기: '4Y 1Q', 매출액: 718, 순이익: -64, 주가: 4018, 재고: 41094, RD: 52, 브랜드: 51, 원가: 390265, 판관비: 387, 퇴직: 76, 영업: 584}
                ]);
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
                return;
            }

            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    renderData(results.data);
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
                },
                error: function(err) {
                    alert("데이터를 불러오지 못했습니다. URL과 권한을 확인하세요.");
                }
            });
        }

        function renderData(data) {
            // 마지막 행과 이전 행 데이터 추출
            const latest = data[data.length - 1];
            const prev = data[data.length - 2] || latest;

            // 텍스트 업데이트
            document.getElementById('val-revenue').innerText = latest.매출액 + "억";
            document.getElementById('val-stock').innerText = latest.주가.toLocaleString();
            document.getElementById('val-inventory').innerText = latest.재고.toLocaleString();
            document.getElementById('val-profit').innerText = (latest.순이익 > 0 ? "+" : "") + latest.순이익 + "억";
            document.getElementById('val-quit').innerText = latest.퇴직 + "명";
            document.getElementById('val-salesforce').innerText = latest.영업 + "명";

            // 차트 업데이트
            const labels = data.map(d => d.분기);
            
            charts.finance.data.labels = labels;
            charts.finance.data.datasets[0].data = data.map(d => d.매출액);
            charts.finance.update();

            charts.stock.data.labels = labels;
            charts.stock.data.datasets[0].data = data.map(d => d.주가);
            charts.stock.update();

            charts.inventory.data.datasets[0].data = [100000 - latest.재고, latest.재고];
            charts.inventory.update();

            // KPI 진행바 업데이트
            const kpiHtml = `
                <div>
                    <div class="flex justify-between text-xs mb-1 font-bold">
                        <span>연구개발비 (R&D)</span>
                        <span class="text-blue-600">${latest.RD}억</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-indigo-500 h-full" style="width: ${(latest.RD/100)*100}%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1 font-bold">
                        <span>브랜드 등급</span>
                        <span class="text-emerald-500">${latest.브랜드} pts</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-emerald-400 h-full" style="width: ${latest.브랜드}%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1 font-bold">
                        <span>단위당 제조원가</span>
                        <span class="text-red-500">${latest.원가.toLocaleString()}</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-red-400 h-full" style="width: ${(latest.원가/500000)*100}%"></div></div>
                </div>
            `;
            document.getElementById('kpi-container').innerHTML = kpiHtml;
        }

        window.onload = () => {
            initCharts();
            updateData();
            // 5분마다 자동 새로고침 (선택 사항)
            setInterval(updateData, 300000);
        };
    </script>
</body>
</html>
