<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경영 실적 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-800">📊 경영 실적 현황판</h1>
            <button onclick="refreshData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">데이터 새로고침</button>
        </header>

        <!-- 요약 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-sm text-gray-500 font-semibold">최근 매출액</p>
                <h3 id="card-revenue" class="text-2xl font-bold text-gray-800">718.5억</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                <p class="text-sm text-gray-500 font-semibold">최근 순이익</p>
                <h3 id="card-profit" class="text-2xl font-bold text-red-600">-64.5억</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                <p class="text-sm text-gray-500 font-semibold">브랜드 등급</p>
                <h3 id="card-brand" class="text-2xl font-bold text-gray-800">5등급</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500">
                <p class="text-sm text-gray-500 font-semibold">기말 재고량</p>
                <h3 id="card-inventory" class="text-2xl font-bold text-gray-800">41,094</h3>
            </div>
        </div>

        <!-- 차트 영역 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 매출 및 순이익 추이 -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h4 class="text-lg font-bold mb-4 text-gray-700">매출 및 순이익 추이</h4>
                <canvas id="revenueChart" height="200"></canvas>
            </div>
            <!-- 판매/생산/재고 현황 -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h4 class="text-lg font-bold mb-4 text-gray-700">판매/생산/재고 현황</h4>
                <canvas id="statusChart" height="200"></canvas>
            </div>
        </div>
    </div>

    <script>
        let revenueChart, statusChart;

        // 초기 데이터 (시트 기반)
        const initialData = [
            {분기: "3차4Q", 매출: 88631620000, 이익: 4119883657, 판매: 129860, 생산: 136080, 재고: 21677, 브랜드: 4},
            {분기: "4차1Q", 매출: 71854237160, 이익: -6454203885, 판매: 103055, 생산: 122472, 재고: 41094, 브랜드: 5}
        ];

        function initCharts(data) {
            const labels = data.map(d => d.분기);
            
            // 매출/순이익 차트
            const ctxRev = document.getElementById('revenueChart').getContext('2d');
            revenueChart = new Chart(ctxRev, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '매출액', data: data.map(d => d.매출), backgroundColor: '#3b82f6' },
                        { label: '순이익', data: data.map(d => d.이익), type: 'line', borderColor: '#ef4444', fill: false }
                    ]
                }
            });

            // 판매/생산/재고 차트
            const ctxStat = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(ctxStat, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '판매량', data: data.map(d => d.판매), backgroundColor: '#10b981' },
                        { label: '생산량', data: data.map(d => d.생산), backgroundColor: '#6366f1' },
                        { label: '재고량', data: data.map(d => d.재고), backgroundColor: '#f59e0b' }
                    ]
                }
            });
        }

        // 구글 앱스 스크립트에서 데이터를 가져오는 함수
        function refreshData() {
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler(updateDashboard).getSheetData();
            } else {
                console.log("GAS 환경이 아닙니다. 초기 데이터를 유지합니다.");
                updateDashboard(initialData);
            }
        }

        function updateDashboard(data) {
            const latest = data[data.length - 1];
            document.getElementById('card-revenue').innerText = (latest.매출 / 100000000).toFixed(1) + '억';
            document.getElementById('card-profit').innerText = (latest.이익 / 100000000).toFixed(1) + '억';
            document.getElementById('card-brand').innerText = latest.브랜드 + '등급';
            document.getElementById('card-inventory').innerText = latest.재고.toLocaleString();
            
            // 차트 업데이트 로직 추가 가능
        }

        window.onload = () => initCharts(initialData);
    </script>
</body>
</html>
