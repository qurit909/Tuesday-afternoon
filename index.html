<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전사 경영 실적 대시보드 (Real-time)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .card-stat { transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 상단 헤더 -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">🚀 전사 경영 실적 대시보드</h1>
                <p class="text-slate-500 mt-1">지정된 스프레드시트 열 이름 최적화 버전 (v2.4)</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="syncStatus" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100 italic">
                    연결 확인 중...
                </span>
                <button onclick="fetchSheetData()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">
                    지금 동기화
                </button>
            </div>
        </header>

        <!-- 핵심 지표 요약 (KPI) -->
        <div id="kpiContainer" class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-10">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
        </div>

        <!-- 메인 분석 차트 영역 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
            <!-- 재무 분석 -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-blue-500 rounded-full"></span> 재무 성장 및 이익 지수
                </h4>
                <div class="h-[300px]">
                    <canvas id="financeChart"></canvas>
                </div>
                <p id="financeInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>
            
            <!-- 운영 분석 -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full"></span> 생산·판매·재고 밸런스
                </h4>
                <div class="h-[300px]">
                    <canvas id="opsChart"></canvas>
                </div>
                <p id="opsInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>

            <!-- HR 분석 -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-purple-500 rounded-full"></span> 인력 구성 및 변동 추이
                </h4>
                <div class="h-[300px]">
                    <canvas id="hrChart"></canvas>
                </div>
                <p id="hrInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>

            <!-- 효율성 분석 -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-orange-500 rounded-full"></span> R&D 투자 vs 제조원가 추이
                </h4>
                <div class="h-[300px]">
                    <canvas id="efficiencyChart"></canvas>
                </div>
                <p id="rdInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>
        </div>

        <!-- 하단 데이터 분석 요약 -->
        <div class="bg-slate-900 rounded-3xl p-8 text-white shadow-2xl">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-2xl">🔍</span>
                <h3 class="text-xl font-bold">경영 분석 통합 인사이트</h3>
            </div>
            <div id="totalInsight" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-slate-300">
                데이터를 분석하고 있습니다...
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv';
        
        let charts = {};

        // 안전하게 숫자로 변환
        function safeNumber(val) {
            if (val === null || val === undefined || val === '') return 0;
            if (typeof val === 'number') return val;
            const sanitized = val.toString().replace(/,/g, '').replace(/[^\d.-]/g, '').trim();
            const num = parseFloat(sanitized);
            return isNaN(num) ? 0 : num;
        }

        // 사용자가 정의한 정확한 열 이름 매핑
        function getVal(row, keys) {
            for (let key of keys) {
                if (row[key] !== undefined) return row[key];
                const target = key.toLowerCase().replace(/\s/g, '');
                const foundKey = Object.keys(row).find(k => k.toLowerCase().replace(/\s/g, '') === target);
                if (foundKey) return row[foundKey];
            }
            return 0;
        }

        async function fetchSheetData() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = '동기화 중...';
            try {
                const response = await fetch(CSV_URL + '&cb=' + new Date().getTime());
                if (!response.ok) throw new Error('시트 연결 실패');
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if(results.data && results.data.length > 0) {
                            renderDashboard(results.data);
                            statusEl.innerText = '✅ 업데이트: ' + new Date().toLocaleTimeString();
                        }
                    }
                });
            } catch (error) {
                console.error(error);
                statusEl.innerText = '❌ 연결 실패';
            }
        }

        function renderDashboard(rawData) {
            // 사용자 요청 열 이름 기반 매핑
            const processedData = rawData.map(item => ({
                분기: getVal(item, ['분기']),
                매출액: safeNumber(getVal(item, ['매출액'])),
                순이익: safeNumber(getVal(item, ['순이익'])),
                주가: safeNumber(getVal(item, ['주가'])),
                연구개발비: safeNumber(getVal(item, ['연구개발비'])),
                판매량: safeNumber(getVal(item, ['판매량'])),
                브랜드등급: safeNumber(getVal(item, ['브랜드등급'])),
                생산량: safeNumber(getVal(item, ['생산량'])),
                기말재고량: safeNumber(getVal(item, ['기말재고량'])),
                단위당제조원가: safeNumber(getVal(item, ['단위당제조원가'])),
                영업직원수: safeNumber(getVal(item, ['영업직원수'])),
                퇴직직원수: safeNumber(getVal(item, ['퇴직직원수'])),
                교육직원수: safeNumber(getVal(item, ['교육직원수'])),
                판매관리비: safeNumber(getVal(item, ['판매관리비']))
            })).filter(d => d.분기 !== 0 && d.분기 !== '');

            if (processedData.length === 0) return;

            const latest = processedData[processedData.length - 1];
            const prev = processedData.length > 1 ? processedData[processedData.length - 2] : latest;

            // KPI 카드 (매출, 이익, 주가, 브랜드, 재고, 원가)
            const kpiContainer = document.getElementById('kpiContainer');
            kpiContainer.innerHTML = `
                ${createKPICard('매출액', (latest.매출액/100000000).toFixed(1) + '억', latest.매출액, prev.매출액, 'text-slate-800')}
                ${createKPICard('순이익', (latest.순이익/100000000).toFixed(1) + '억', latest.순이익, prev.순이익, 'text-rose-500')}
                ${createKPICard('주가', latest.주가.toLocaleString() + '원', latest.주가, prev.주가, 'text-indigo-600')}
                ${createKPICard('브랜드등급', latest.브랜드등급 + '등급', latest.브랜드등급, prev.브랜드등급, 'text-emerald-600', true)}
                ${createKPICard('기말재고량', latest.기말재고량.toLocaleString(), latest.기말재고량, prev.기말재고량, 'text-amber-600', false, true)}
                ${createKPICard('단위당제조원가', latest.단위당제조원가.toLocaleString() + '원', latest.단위당제조원가, prev.단위당제조원가, 'text-slate-700', false, true)}
            `;

            // 차트 렌더링
            updateFinanceChart(processedData);
            updateOpsChart(processedData);
            updateHRChart(processedData);
            updateEfficiencyChart(processedData);
            
            // 분석 인사이트
            generateAdvancedInsights(processedData);
        }

        function createKPICard(title, value, current, previous, colorClass, isInverse = false, isCost = false) {
            const diff = current - previous;
            const diffPercent = previous !== 0 ? ((diff / Math.abs(previous)) * 100).toFixed(1) : 0;
            let trendHtml = '';
            if (diff > 0) {
                const color = (isInverse || isCost) ? 'text-rose-500' : 'text-emerald-500';
                trendHtml = `<span class="${color} text-[10px] font-bold">▲ ${diffPercent}%</span>`;
            } else if (diff < 0) {
                const color = (isInverse || isCost) ? 'text-emerald-500' : 'text-rose-500';
                trendHtml = `<span class="${color} text-[10px] font-bold">▼ ${Math.abs(diffPercent)}%</span>`;
            } else {
                trendHtml = `<span class="text-slate-400 text-[10px] font-bold">- 0%</span>`;
            }

            return `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-stat">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">${title}</p>
                    <h3 class="${colorClass} text-xl font-bold truncate">${value}</h3>
                    <div class="mt-1">${trendHtml}</div>
                </div>
            `;
        }

        function updateFinanceChart(data) {
            const ctx = document.getElementById('financeChart');
            if(charts.finance) charts.finance.destroy();
            charts.finance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { 
                            label: '순이익(억)', 
                            data: data.map(d => d.순이익/100000000), 
                            type: 'line', 
                            borderColor: '#f43f5e', 
                            pointBackgroundColor: '#f43f5e', 
                            tension: 0.3,
                            order: 1 // 선 그래프를 상단으로 (작을수록 위)
                        },
                        { 
                            label: '매출액(억)', 
                            data: data.map(d => d.매출액/100000000), 
                            backgroundColor: '#3b82f6', 
                            borderRadius: 4,
                            order: 2 // 막대 그래프를 하단으로
                        }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function updateOpsChart(data) {
            const ctx = document.getElementById('opsChart');
            if(charts.ops) charts.ops.destroy();
            charts.ops = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: '생산량', data: data.map(d => d.생산량), borderColor: '#10b981', fill: false },
                        { label: '판매량', data: data.map(d => d.판매량), borderColor: '#6366f1', fill: false },
                        { label: '기말재고량', data: data.map(d => d.기말재고량), borderColor: '#f59e0b', borderDash: [5, 5] }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function updateHRChart(data) {
            const ctx = document.getElementById('hrChart');
            if(charts.hr) charts.hr.destroy();
            charts.hr = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: '영업직원', data: data.map(d => d.영업직원수), backgroundColor: '#a855f7' },
                        { label: '교육인원', data: data.map(d => d.교육직원수), backgroundColor: '#2dd4bf' },
                        { label: '퇴직인원', data: data.map(d => d.퇴직직원수), backgroundColor: '#f43f5e' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        function updateEfficiencyChart(data) {
            const ctx = document.getElementById('efficiencyChart');
            if(charts.efficiency) charts.efficiency.destroy();
            charts.efficiency = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: '연구개발비(억)', data: data.map(d => d.연구개발비/100000000), borderColor: '#0ea5e9', yAxisID: 'y1' },
                        { label: '단위당제조원가(원)', data: data.map(d => d.단위당제조원가), borderColor: '#f97316', yAxisID: 'y' }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        y: { position: 'left', title: { display: true, text: '원가(원)' } },
                        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'R&D(억)' } }
                    }
                }
            });
        }

        function generateAdvancedInsights(data) {
            const latest = data[data.length - 1];
            const prev = data.length > 1 ? data[data.length - 2] : latest;

            const profitMargin = latest.매출액 > 0 ? (latest.순이익 / latest.매출액 * 100).toFixed(1) : 0;
            document.getElementById('financeInsight').innerText = `영업 효율성: 현재 이익률은 ${profitMargin}%를 기록 중입니다.`;

            const invRatio = (latest.기말재고량 / (latest.판매량 + 1)).toFixed(2);
            document.getElementById('opsInsight').innerText = invRatio > 1.2 ? "재고 주의: 판매 대비 재고가 높습니다." : "재고 안정: 수급 밸런스가 적절합니다.";

            const attrition = (latest.퇴직직원수 / (latest.영업직원수 + 1) * 100).toFixed(1);
            document.getElementById('hrInsight').innerText = `조직 진단: 이탈률 ${attrition}%로 인력 관리가 필요한 시점입니다.`;

            const costDiff = prev.단위당제조원가 - latest.단위당제조원가;
            document.getElementById('rdInsight').innerText = costDiff > 0 ? `원가 절감: 전분기 대비 ${costDiff.toLocaleString()}원 감소되었습니다.` : "원가 관리: 제조원가 상승 요인을 분석하십시오.";

            const totalInsight = document.getElementById('totalInsight');
            totalInsight.innerHTML = `
                <div>
                    <h4 class="text-white font-bold mb-2">📊 종합 실적 분석</h4>
                    <p>${latest.분기} 매출액은 ${(latest.매출액/100000000).toFixed(1)}억 원이며, 연구개발비 투입 대비 원가 개선 효과를 모니터링 중입니다.</p>
                </div>
                <div>
                    <h4 class="text-white font-bold mb-2">🎯 경영 제언</h4>
                    <p>브랜드등급이 ${latest.브랜드등급}단계이므로 마케팅 강화가 필요하며, 판매관리비 효율화를 통해 순이익 구조를 개선해야 합니다.</p>
                </div>
            `;
        }

        window.onload = fetchSheetData;
    </script>
</body>
</html>
