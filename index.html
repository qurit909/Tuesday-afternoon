<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 경영 정보 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --primary: #007bff; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status-tag { padding: 5px 12px; border-radius: 20px; font-size: 12px; background: #e1f5fe; color: #01579b; font-weight: bold; }
        
        /* 대시보드 레이아웃 */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .full { grid-column: 1 / -1; }
        
        h2 { font-size: 1.1rem; color: #333; margin-top: 0; border-left: 4px solid var(--primary); padding-left: 10px; }
        canvas { width: 100% !important; max-height: 350px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 전사 경영 실적 라이브</h1>
        <div id="syncStatus" class="status-tag">데이터 동기화 중...</div>
    </div>

    <div class="grid">
        <div class="card full">
            <h2>매출액 및 영업이익 추이</h2>
            <canvas id="chart_main"></canvas>
        </div>

        <div class="card">
            <h2>분기별 주가 변동</h2>
            <canvas id="chart_stock"></canvas>
        </div>

        <div class="card">
            <h2>시장 점유율 (%)</h2>
            <canvas id="chart_market"></canvas>
        </div>

        <div class="card full">
            <h2>영업 인력 및 인건비 현황</h2>
            <canvas id="chart_hr"></canvas>
        </div>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQrNAvtAANdFK70ElUqZKgxL2zza8ODH55YHhia15f4aqQU2buXD-pyjzkmfRCpd41JBwkik6iQvWuP/pub?output=csv';
    let charts = {};

    async function updateDashboard() {
        try {
            // 캐시 방지를 위해 타임스탬프 추가
            const response = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
            const text = await response.text();
            
            // CSV 파싱 (쉼표 기준 분리 및 공백 제거)
            const rows = text.trim().split('\n').map(row => row.split(',').map(cell => cell.trim()));
            const data = rows.slice(1); // 헤더 제외 데이터셋

            // 데이터 추출 (사용자 제공 열 순서 기준)
            const labels = data.map(r => r[0]);          // 분기
            const marketShare = data.map(r => parseFloat(r[1]) || 0); // 시장점유율
            const stockPrice = data.map(r => parseFloat(r[2]) || 0);  // 주가
            const revenue = data.map(r => parseFloat(r[12]) || 0);    // 매출
            const opProfit = data.map(r => parseFloat(r[13]) || 0);   // 영업이익
            const hrCount = data.map(r => parseFloat(r[9]) || 0);     // 영업직원수
            const hrCost = data.map(r => parseFloat(r[14]) || 0);     // 직원인건비

            // 차트 렌더링 호출
            render('chart_main', 'line', labels, [
                { label: '매출액', data: revenue, borderColor: '#4e73df', backgroundColor: 'rgba(78,115,223,0.05)', fill: true },
                { label: '영업이익', data: opProfit, borderColor: '#1cc88a', fill: false }
            ]);

            render('chart_stock', 'bar', labels, [
                { label: '주가', data: stockPrice, backgroundColor: '#f6c23e' }
            ]);

            render('chart_market', 'radar', labels, [
                { label: '시장점유율(%)', data: marketShare, backgroundColor: 'rgba(54, 162, 235, 0.2)', borderColor: '#36a2eb' }
            ]);

            render('chart_hr', 'line', labels, [
                { label: '영업직원수', data: hrCount, borderColor: '#e74a3b', yAxisID: 'y' },
                { label: '인건비', data: hrCost, borderColor: '#858796', borderDash: [5,5], yAxisID: 'y1' }
            ], true);

            document.getElementById('syncStatus').innerText = `마지막 업데이트: ${new Date().toLocaleTimeString()}`;
            document.getElementById('syncStatus').style.background = "#e8f5e9";
            document.getElementById('syncStatus').style.color = "#2e7d32";

        } catch (err) {
            console.error(err);
            document.getElementById('syncStatus').innerText = "⚠️ 시트 연결 대기 중...";
            document.getElementById('syncStatus').style.background = "#ffebee";
            document.getElementById('syncStatus').style.color = "#c62828";
        }
    }

    function render(id, type, labels, datasets, hasSecondAxis = false) {
        const ctx = document.getElementById(id).getContext('2d');
        const options = {
            responsive: true,
            maintainAspectRatio: false,
            scales: hasSecondAxis ? {
                y: { type: 'linear', display: true, position: 'left' },
                y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false } }
            } : {}
        };

        if (charts[id]) {
            charts[id].data.labels = labels;
            charts[id].data.datasets = datasets;
            charts[id].update('none');
        } else {
            charts[id] = new Chart(ctx, { type, data: { labels, datasets }, options });
        }
    }

    // 30초마다 자동 갱신
    setInterval(updateDashboard, 30000);
    updateDashboard();
</script>

</body>
</html>
