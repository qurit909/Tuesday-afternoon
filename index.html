<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 경영 지표 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #f4f7f9; --card-bg: #ffffff; --primary-blue: #007bff; --text-dark: #333; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-dark); }
        .container { max-width: 1200px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .status-box { font-size: 0.85rem; padding: 5px 15px; border-radius: 20px; background: #e0e0e0; color: #666; }
        .online { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        /* 레이아웃 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .full { grid-column: 1 / -1; }
        
        h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 15px; color: #555; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .data-table th, .data-table td { border-bottom: 1px solid #eee; padding: 10px; text-align: right; }
        .data-table th:first-child, .data-table td:first-child { text-align: left; }
        .data-table th { background: #f8f9fa; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📊 전사 실적 라이브 대시보드</h1>
        <div id="statusIndicator" class="status-box">데이터 연결 중...</div>
    </header>

    <div class="dashboard-grid">
        <div class="card full">
            <h2>분기별 매출액 및 영업이익 (실시간)</h2>
            <canvas id="chart_main" style="height: 300px;"></canvas>
        </div>

        <div class="card">
            <h2>주가 및 시장 점유율 추이</h2>
            <canvas id="chart_sub"></canvas>
        </div>

        <div class="card">
            <h2>최근 데이터 상세</h2>
            <div id="table_container"></div>
        </div>
    </div>
</div>

<script>
    // 1. 구글 시트 CSV 주소 (사용자 제공 URL)
    const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQfXTJqo25PSQM9lGURp71r5Y6ga6i6hX8FP27B9YlVGMAcQ9Mb4YznfVy1GU6NBWMaLC8qiZNzUqSK/pub?gid=0&single=true&output=csv';
    
    let mainChart, subChart;

    async function fetchSpreadsheetData() {
        try {
            // 캐시 방지를 위해 랜덤 쿼리 추가
            const cacheBuster = `&t=${new Date().getTime()}`;
            const response = await fetch(BASE_URL + cacheBuster);
            if (!response.ok) throw new Error("데이터를 가져오지 못했습니다.");
            
            const csvText = await response.text();
            const rows = csvText.trim().split('\n').map(row => row.split(',').map(cell => cell.trim()));
            
            processData(rows);
            
            const status = document.getElementById('statusIndicator');
            status.innerText = `✅ 실시간 동기화 중 (${new Date().toLocaleTimeString()})`;
            status.className = 'status-box online';
        } catch (error) {
            console.error(error);
            document.getElementById('statusIndicator').innerText = "❌ 시트 연결 오류 (게시 상태 확인)";
        }
    }

    function processData(rows) {
        const headers = rows[0];
        const data = rows.slice(1);

        // 데이터 매핑 (사용자 요청 필드 기준)
        const labels = data.map(r => r[0]);           // 분기
        const marketShare = data.map(r => parseFloat(r[1]) || 0); // 시장점유율
        const stockPrice = data.map(r => parseFloat(r[2]) || 0);  // 주가
        const revenue = data.map(r => parseFloat(r[12]) || 0);    // 매출
        const opProfit = data.map(r => parseFloat(r[13]) || 0);   // 영업이익

        updateCharts(labels, revenue, opProfit, marketShare, stockPrice);
        updateTable(headers, data.slice(-5)); // 최근 5개 행만 표시
    }

    function updateCharts(labels, revenue, opProfit, marketShare, stockPrice) {
        // 메인 차트 (매출 & 영업이익)
        const ctx1 = document.getElementById('chart_main').getContext('2d');
        if (mainChart) mainChart.destroy();
        mainChart = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '매출', data: revenue, borderColor: '#007bff', backgroundColor: 'rgba(0,123,255,0.1)', fill: true, tension: 0.3 },
                    { label: '영업이익', data: opProfit, borderColor: '#28a745', fill: false, tension: 0.3 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // 서브 차트 (주가 & 점유율)
        const ctx2 = document.getElementById('chart_sub').getContext('2d');
        if (subChart) subChart.destroy();
        subChart = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: '주가', data: stockPrice, backgroundColor: '#ffc107', yAxisID: 'y' },
                    { label: '점유율(%)', data: marketShare, type: 'line', borderColor: '#dc3545', yAxisID: 'y1' }
                ]
            },
            options: { 
                scales: { 
                    y: { position: 'left', title: { display: true, text: '주가' } },
                    y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '점유율(%)' } }
                }
            }
        });
    }

    function updateTable(headers, lastRows) {
        let html = '<table class="data-table"><thead><tr>';
        // 분기, 점유율, 주가, 매출, 영업이익 열만 표시
        [0, 1, 2, 12, 13].forEach(idx => html += `<th>${headers[idx]}</th>`);
        html += '</tr></thead><tbody>';

        lastRows.reverse().forEach(row => {
            html += '<tr>';
            [0, 1, 2, 12, 13].forEach(idx => {
                let val = row[idx];
                if (!isNaN(val) && idx !== 0) val = Number(val).toLocaleString();
                html += `<td>${val}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('table_container').innerHTML = html;
    }

    // 20초마다 시트 데이터를 새로 읽어옴
    setInterval(fetchSpreadsheetData, 20000);
    fetchSpreadsheetData();
</script>

</body>
</html>
