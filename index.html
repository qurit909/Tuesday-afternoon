<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Performance Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .gradient-card-1 { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
        .gradient-card-2 { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .gradient-card-3 { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .trend-up { color: #ef4444; }
        .trend-down { color: #3b82f6; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 border-b pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800">경영 성과 분석 리포트</h1>
                <p class="text-slate-500 mt-2">3차년도 4분기 vs 4차년도 1분기 비교 분석</p>
            </div>
            <div class="text-right mt-4 md:mt-0">
                <span id="last-updated" class="text-xs font-mono text-slate-400">데이터 로드 중...</span>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10" id="kpi-container">
            <!-- Loading States -->
            <div class="animate-pulse bg-slate-200 h-32 rounded-2xl"></div>
            <div class="animate-pulse bg-slate-200 h-32 rounded-2xl"></div>
            <div class="animate-pulse bg-slate-200 h-32 rounded-2xl"></div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Bar Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <span class="w-2 h-6 bg-indigo-500 rounded-full mr-3"></span> 주요 지표 성장 추이
                </h3>
                <div class="relative h-[350px]">
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <!-- Detailed Table -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full mr-3"></span> 세부 항목 비교표
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 text-sm border-b">
                                <th class="pb-3 font-semibold">항목</th>
                                <th class="pb-3 font-semibold text-right">3차 4Q</th>
                                <th class="pb-3 font-semibold text-right">4차 1Q</th>
                                <th class="pb-3 font-semibold text-right">증감률</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-slate-700">
                            <!-- Data injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv';
        
        // Helper to parse currency string to number
        const parseValue = (val) => {
            if (!val) return 0;
            return parseFloat(val.toString().replace(/[^0-9.-]+/g, ""));
        };

        // Helper to format currency
        const formatCurrency = (val) => {
            return new Intl.NumberFormat('ko-KR').format(val);
        };

        async function fetchData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    processData(results.data);
                    document.getElementById('last-updated').innerText = `최신 업데이트: ${new Date().toLocaleString()}`;
                },
                error: function(err) {
                    console.error("Data Load Error:", err);
                }
            });
        }

        function processData(data) {
            // Find specific rows by '항목'
            const findRow = (name) => data.find(r => r['항목'] === name);
            
            const targetMetrics = ['매출액', '영업이익', '당기순이익'];
            const processed = targetMetrics.map(name => {
                const row = findRow(name);
                return {
                    name: name,
                    prev: parseValue(row['3차년도 4분기']),
                    curr: parseValue(row['4차년도 1분기'])
                };
            });

            renderKPIs(processed);
            renderTable(data);
            renderCharts(processed);
        }

        function renderKPIs(metrics) {
            const container = document.getElementById('kpi-container');
            container.innerHTML = metrics.map((m, i) => {
                const diff = m.curr - m.prev;
                const percent = ((diff / m.prev) * 100).toFixed(1);
                const isUp = diff >= 0;
                
                return `
                    <div class="gradient-card-${i+1} p-6 rounded-2xl text-white shadow-lg">
                        <div class="flex justify-between items-start">
                            <span class="text-sm font-medium opacity-80">${m.name} (4차 1Q)</span>
                            <span class="bg-white/20 px-2 py-1 rounded text-xs">${isUp ? '▲' : '▼'} ${Math.abs(percent)}%</span>
                        </div>
                        <div class="mt-4 text-2xl font-extrabold">${formatCurrency(m.curr)}원</div>
                        <div class="mt-2 text-xs opacity-70">전분기: ${formatCurrency(m.prev)}원</div>
                    </div>
                `;
            }).join('');
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            // Show all numeric rows
            tbody.innerHTML = data.filter(r => r['항목'] && r['3차년도 4분기']).map(row => {
                const prev = parseValue(row['3차년도 4분기']);
                const curr = parseValue(row['4차년도 1분기']);
                const diff = prev !== 0 ? ((curr - prev) / prev * 100).toFixed(1) : '0.0';
                
                return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="py-4 font-semibold text-sm">${row['항목']}</td>
                        <td class="py-4 text-right text-sm">${formatCurrency(prev)}</td>
                        <td class="py-4 text-right text-sm font-bold text-slate-900">${formatCurrency(curr)}</td>
                        <td class="py-4 text-right text-sm ${diff >= 0 ? 'text-red-500' : 'text-blue-500'} font-bold">
                            ${diff >= 0 ? '+' : ''}${diff}%
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderCharts(metrics) {
            const ctx = document.getElementById('barChart').getContext('2d');
            
            // Clean up existing chart if any
            if (window.myChart) window.myChart.destroy();

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: metrics.map(m => m.name),
                    datasets: [
                        {
                            label: '3차년도 4분기',
                            data: metrics.map(m => m.prev),
                            backgroundColor: '#e2e8f0',
                            borderRadius: 8,
                        },
                        {
                            label: '4차년도 1분기',
                            data: metrics.map(m => m.curr),
                            backgroundColor: '#6366f1',
                            borderRadius: 8,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { usePointStyle: true, font: { family: 'Pretendard' } } }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: { family: 'Pretendard' },
                                callback: value => value.toLocaleString()
                            },
                            grid: { display: false }
                        },
                        x: {
                            ticks: { font: { family: 'Pretendard', weight: 'bold' } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // Initial Load
        window.onload = fetchData;
    </script>
</body>
</html>
