<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전사 경영 실적 대시보드 (Real-time)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .card-stat { transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 상단 헤더 -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">🚀 전사 경영 실적 대시보드</h1>
                <p class="text-slate-500 mt-1">구글 스프레드시트 실시간 연동 데이터 분석 (v2.2)</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="syncStatus" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100 italic">
                    연결 확인 중...
                </span>
                <button onclick="fetchSheetData()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">
                    지금 동기화
                </button>
            </div>
        </header>

        <!-- 핵심 지표 요약 -->
        <div id="kpiContainer" class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-10">
            <!-- 데이터 로드 전 대기 화면 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-24"></div>
        </div>

        <!-- 메인 분석 그리드 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-blue-500 rounded-full"></span> 재무 성장 및 이익 지수
                </h4>
                <div class="h-[300px]">
                    <canvas id="financeChart"></canvas>
                </div>
                <p id="financeInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>
            
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full"></span> 생산·판매·재고 자산 밸런스
                </h4>
                <div class="h-[300px]">
                    <canvas id="opsChart"></canvas>
                </div>
                <p id="opsInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-purple-500 rounded-full"></span> 부서 인력 구성 및 이탈 추이
                </h4>
                <div class="h-[300px]">
                    <canvas id="hrChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-2 h-6 bg-orange-500 rounded-full"></span> R&D 투자액 vs 제조원가 절감률
                </h4>
                <div class="h-[300px]">
                    <canvas id="efficiencyChart"></canvas>
                </div>
                <p id="rdInsight" class="mt-4 text-sm text-slate-500 italic"></p>
            </div>
        </div>

        <!-- 하단 데이터 분석 요약 -->
        <div class="bg-slate-900 rounded-3xl p-8 text-white shadow-2xl">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-2xl">🔍</span>
                <h3 class="text-xl font-bold">경영 분석 통합 인사이트</h3>
            </div>
            <div id="totalInsight" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-slate-300">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </div>

    <script>
        // 실제 구글 시트 CSV 주소
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv';
        
        let charts = {};

        // 안전하게 숫자로 변환하는 헬퍼 함수 (쉼표 제거 및 다양한 이름 대응)
        function safeNumber(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return val;
            const sanitized = val.toString().replace(/,/g, '').replace(/[^0-9.-]/g, '').trim();
            const num = parseFloat(sanitized);
            return isNaN(num) ? 0 : num;
        }

        // 시트 컬럼명을 찾기 위한 유연한 매핑 함수
        function getVal(row, keys) {
            for (let key of keys) {
                if (row[key] !== undefined) return row[key];
                // 대소문자 무시 검색
                const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
                if (foundKey) return row[foundKey];
            }
            return 0;
        }

        async function fetchSheetData() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = '데이터 동기화 중...';
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('시트 연결 실패');
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if(results.data && results.data.length > 0) {
                            renderDashboard(results.data);
                            statusEl.innerText = '✅ 최근 업데이트: ' + new Date().toLocaleTimeString();
                        } else {
                            statusEl.innerText = '⚠️ 데이터 형식이 올바르지 않습니다.';
                        }
                    },
                    error: function(err) {
                        console.error("CSV 파싱 에러:", err);
                        statusEl.innerText = '❌ 파싱 에러 발생';
                    }
                });
            } catch (error) {
                console.error("연결 에러:", error);
                statusEl.innerText = '❌ 시트 데이터를 찾을 수 없음';
                // 실패 시 사용자 알림을 위해 안내 메시지 출력
                document.getElementById('totalInsight').innerHTML = "구글 시트의 '웹에 게시' 설정이 완료되었는지 확인해주세요. (CSV 형식으로 게시 필수)";
            }
        }

        function renderDashboard(rawData) {
            // 다양한 언어/형식의 헤더에 대응하기 위해 매핑
            const processedData = rawData.map(item => ({
                분기: getVal(item, ['분기', 'Quarter', '시기']),
                매출: safeNumber(getVal(item, ['매출', 'Revenue', 'Sales', '매출액'])),
                이익: safeNumber(getVal(item, ['이익', 'Profit', 'Income', '순이익'])),
                주가: safeNumber(getVal(item, ['주가', 'Stock', 'Price'])),
                연구비: safeNumber(getVal(item, ['연구비', 'RD', 'R&D', '연구개발비'])),
                판매량: safeNumber(getVal(item, ['판매량', 'Sales_Vol', 'Volume'])),
                브랜드: safeNumber(getVal(item, ['브랜드', 'Brand', 'Grade'])),
                생산량: safeNumber(getVal(item, ['생산량', 'Prod', 'Production'])),
                재고: safeNumber(getVal(item, ['재고', 'Inventory', 'Stock_Vol'])),
                원가: safeNumber(getVal(item, ['원가', 'Cost', 'COGS', '제조원가'])),
                영업직: safeNumber(getVal(item, ['영업직', 'Sales_Staff'])),
                퇴직직: safeNumber(getVal(item, ['퇴직직', 'Resign', 'Quit'])),
                교육직: safeNumber(getVal(item, ['교육직', 'Education', 'Trainee'])),
                판관비: safeNumber(getVal(item, ['판관비', 'SG&A']))
            })).filter(d => d.분기 !== 'N/A' && d.분기 !== 0);

            if (processedData.length === 0) {
                document.getElementById('syncStatus').innerText = '⚠️ 데이터 필터링 실패 (헤더 불일치)';
                return;
            }

            const latest = processedData[processedData.length - 1];
            const prev = processedData.length > 1 ? processedData[processedData.length - 2] : latest;

            // 1. KPI 카드 업데이트
            const kpiContainer = document.getElementById('kpiContainer');
            kpiContainer.innerHTML = `
                ${createKPICard('매출액', (latest.매출/100000000).toFixed(1) + '억', latest.매출, prev.매출, 'text-slate-800')}
                ${createKPICard('순이익', (latest.이익/100000000).toFixed(1) + '억', latest.이익, prev.이익, 'text-rose-500')}
                ${createKPICard('현재 주가', latest.주가.toLocaleString() + '원', latest.주가, prev.주가, 'text-indigo-600')}
                ${createKPICard('브랜드', latest.브랜드 + '등급', latest.브랜드, prev.브랜드, 'text-slate-800', true)}
                ${createKPICard('제조 원가', latest.원가.toLocaleString() + '원', latest.원가, prev.원가, 'text-slate-800', false, true)}
                ${createKPICard('기말 재고', latest.재고.toLocaleString(), latest.재고, prev.재고, 'text-amber-600', false, true)}
            `;

            // 2. 차트 렌더링
            updateFinanceChart(processedData);
            updateOpsChart(processedData);
            updateHRChart(processedData);
            updateEfficiencyChart(processedData);
            
            // 3. 지능형 인사이트 생성
            generateAdvancedInsights(processedData);
        }

        function createKPICard(title, value, current, previous, colorClass, isInverse = false, isCost = false) {
            const diff = current - previous;
            const diffPercent = previous !== 0 ? ((diff / Math.abs(previous)) * 100).toFixed(1) : 0;
            
            let trendHtml = '';
            if (diff > 0) {
                const color = (isInverse || isCost) ? 'text-rose-500' : 'text-emerald-500';
                trendHtml = `<span class="${color} text-[10px] font-bold">▲ ${diffPercent}%</span>`;
            } else if (diff < 0) {
                const color = (isInverse || isCost) ? 'text-emerald-500' : 'text-rose-500';
                trendHtml = `<span class="${color} text-[10px] font-bold">▼ ${Math.abs(diffPercent)}%</span>`;
            } else {
                trendHtml = `<span class="text-slate-400 text-[10px] font-bold">- 0%</span>`;
            }

            return `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 card-stat">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">${title}</p>
                    <h3 class="${colorClass} text-xl font-bold truncate">${value}</h3>
                    <div class="mt-1">${trendHtml}</div>
                </div>
            `;
        }

        // 차트 업데이트 함수들 (차트 인스턴스 재사용)
        function updateFinanceChart(data) {
            const ctx = document.getElementById('financeChart');
            if(charts.finance) charts.finance.destroy();
            charts.finance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: '매출액(억)', data: data.map(d => d.매출/100000000), backgroundColor: '#3b82f6', borderRadius: 5 },
                        { label: '순이익(억)', data: data.map(d => d.이익/100000000), type: 'line', borderColor: '#f43f5e', backgroundColor: '#f43f5e', tension: 0.4, fill: false }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function updateOpsChart(data) {
            const ctx = document.getElementById('opsChart');
            if(charts.ops) charts.ops.destroy();
            charts.ops = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: '생산량', data: data.map(d => d.생산량), borderColor: '#10b981', tension: 0.3 },
                        { label: '판매량', data: data.map(d => d.판매량), borderColor: '#6366f1', tension: 0.3 },
                        { label: '기말재고', data: data.map(d => d.재고), borderColor: '#f59e0b', borderDash: [5, 5], tension: 0.3 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function updateHRChart(data) {
            const ctx = document.getElementById('hrChart');
            if(charts.hr) charts.hr.destroy();
            charts.hr = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: '영업직', data: data.map(d => d.영업직), backgroundColor: '#a855f7' },
                        { label: '교육직', data: data.map(d => d.교육직), backgroundColor: '#ec4899' },
                        { label: '퇴직직', data: data.map(d => d.퇴직직), backgroundColor: '#64748b' }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { x: { stacked: true }, y: { stacked: true } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function updateEfficiencyChart(data) {
            const ctx = document.getElementById('efficiencyChart');
            if(charts.efficiency) charts.efficiency.destroy();
            charts.efficiency = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.분기),
                    datasets: [
                        { label: 'R&D 투자액(억)', data: data.map(d => d.연구비/100000000), borderColor: '#06b6d4', yAxisID: 'y1' },
                        { label: '제조원가(원)', data: data.map(d => d.원가), borderColor: '#f97316', yAxisID: 'y' }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        y: { type: 'linear', position: 'left', title: { display: true, text: '원가(원)' } },
                        y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'R&D(억)' } }
                    }
                }
            });
        }

        function generateAdvancedInsights(data) {
            const latest = data[data.length - 1];
            const prev = data.length > 1 ? data[data.length - 2] : latest;

            const profitMargin = latest.매출 > 0 ? (latest.이익 / latest.매출 * 100).toFixed(1) : 0;
            document.getElementById('financeInsight').innerText = `현재 이익률은 약 ${profitMargin}%입니다. 매출 대비 판관비 비중을 검토하십시오.`;

            const inventoryTurnover = (latest.판매량 / (latest.생산량 + 1)).toFixed(2);
            let opsMsg = inventoryTurnover > 0.9 ? "판매 속도가 생산 속도를 잘 따라가고 있습니다." : "생산 대비 판매량이 저조하여 재고 부담이 증가할 수 있습니다.";
            document.getElementById('opsInsight').innerText = opsMsg;

            const costReduction = prev.원가 - latest.원가;
            document.getElementById('rdInsight').innerText = costReduction > 0 ? `R&D 투자가 원가 절감(${costReduction.toLocaleString()}원)에 긍정적 영향을 주고 있습니다.` : "R&D 투자가 원가 절감으로 이어지는 속도가 더딥니다. 공정 개선을 확인하세요.";

            const totalInsight = document.getElementById('totalInsight');
            const revenueChange = prev.매출 !== 0 ? ((latest.매출-prev.매출)/prev.매출*100).toFixed(1) : 0;
            totalInsight.innerHTML = `
                <div>
                    <h4 class="text-white font-bold mb-2">📈 성장성 및 수익성</h4>
                    <p>현재 ${latest.분기} 기준, 전분기 대비 매출이 ${revenueChange}% 변화했습니다. ${latest.이익 < 0 ? '순이익이 적자 상태이므로 긴급 비용 통제가 필요합니다.' : '수익성이 유지되고 있으며 브랜드 가치 제고에 집중할 시기입니다.'}</p>
                </div>
                <div>
                    <h4 class="text-white font-bold mb-2">👤 인적 자원 리스크</h4>
                    <p>이번 분기 퇴직 인원은 ${latest.퇴직직}명입니다. 교육 인원(${latest.교육직}명)과의 비율을 고려할 때, ${latest.퇴직직 > latest.교육직 ? '숙련도 저하 리스크가 있으니 보상 체계를 점검하십시오.' : '안정적인 인력 충원이 이루어지고 있습니다.'}</p>
                </div>
            `;
        }

        // 초기 실행
        window.onload = fetchSheetData;
    </script>
</body>
</html>
