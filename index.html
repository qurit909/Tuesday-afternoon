<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경영 성과 분석 대시보드 (3Q4 vs 4Q1)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .card { padding: 20px; border-radius: 12px; text-align: center; color: white; }
        .card.sales { background: #4e73df; }
        .card.profit { background: #1cc88a; }
        .card.net { background: #36b9cc; }
        .card .label { font-size: 0.9rem; opacity: 0.9; }
        .card .value { font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .card .diff { font-size: 0.85rem; font-weight: 500; }
        .chart-container { position: relative; height: 400px; width: 100%; }
        .up { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 경영 성과 비교 (3차 4Q vs 4차 1Q)</h1>
    
    <div class="grid" id="summary-grid">
        </div>

    <div class="chart-container">
        <canvas id="performanceChart"></canvas>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv';

    function formatNumber(num) {
        return new Intl.NumberFormat('ko-KR').format(num);
    }

    function calculateDiff(current, previous) {
        const diff = ((current - previous) / previous * 100).toFixed(1);
        return diff > 0 ? `▲ ${diff}%` : `▼ ${diff}%`;
    }

    Papa.parse(CSV_URL, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data;
            // 3차년도 4분기와 4차년도 1분기 데이터 필터링 (시트 구조에 맞춰 인덱싱)
            const q3_4 = data.find(row => row['분기'] === '3차년도 4분기');
            const q4_1 = data.find(row => row['분기'] === '4차년도 1분기');

            if (q3_4 && q4_1) {
                renderSummary(q3_4, q4_1);
                renderChart(q3_4, q4_1);
            }
        }
    });

    function renderSummary(prev, curr) {
        const grid = document.getElementById('summary-grid');
        const metrics = [
            { label: '매출액', key: '매출액', class: 'sales' },
            { label: '영업이익', key: '영업이익', class: 'profit' },
            { label: '당기순이익', key: '당기순이익', class: 'net' }
        ];

        grid.innerHTML = metrics.map(m => `
            <div class="card ${m.class}">
                <div class="label">${m.label} (현재)</div>
                <div class="value">${formatNumber(curr[m.key])}원</div>
                <div class="diff">${calculateDiff(curr[m.key], prev[m.key])} 대비 전분기</div>
            </div>
        `).join('');
    }

    function renderChart(prev, curr) {
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['매출액', '영업이익', '당기순이익'],
                datasets: [
                    {
                        label: '3차년도 4분기',
                        data: [prev['매출액'], prev['영업이익'], prev['당기순이익']],
                        backgroundColor: '#dddfeb'
                    },
                    {
                        label: '4차년도 1분기',
                        data: [curr['매출액'], curr['영업이익'], curr['당기순이익']],
                        backgroundColor: '#4e73df'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { callback: value => value.toLocaleString() } }
                }
            }
        });
    }
</script>

</body>
</html>
