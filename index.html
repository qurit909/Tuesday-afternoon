<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경영 성과 정밀 분석 (3Q4 vs 4Q1)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 40px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 15px; text-align: center; }
        .stat-label { color: #666; font-size: 0.95rem; margin-bottom: 10px; }
        .stat-value { font-size: 1.6rem; font-weight: 800; color: #1a1a1a; }
        .stat-diff { margin-top: 8px; font-size: 0.9rem; font-weight: 600; }
        .up { color: #e74c3c; } .down { color: #3498db; }
        canvas { max-height: 450px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 경영 성과 분석 리포트</h1>
        <p id="update-date">데이터 불러오는 중...</p>
    </div>
    
    <div class="stat-grid" id="stats">
        </div>

    <div style="position: relative; height:400px;">
        <canvas id="compChart"></canvas>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8VS0pkPm4gXulpUqNVk5aIaq22n733XbopZQwkTqYHr75KJeirIODEt0H9h66zG7Ac0wh6c-AE_1f/pub?gid=0&single=true&output=csv';

    // 문자열 숫자를 순수 숫자로 변환 (콤마 제거)
    const parseNum = (str) => Number(String(str).replace(/[^0-9.-]+/g, ""));
    const formatNum = (num) => new Intl.NumberFormat('ko-KR').format(num);

    Papa.parse(CSV_URL, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data;
            
            // 시트의 '항목' 컬럼을 기준으로 데이터 추출
            const getItem = (name) => data.find(row => row['항목'] === name) || {};

            const salesRow = getItem('매출액');
            const profitRow = getItem('영업이익');
            const netIncomeRow = getItem('당기순이익');

            const metrics = [
                { label: '매출액', prev: parseNum(salesRow['3차년도 4분기']), curr: parseNum(salesRow['4차년도 1분기']) },
                { label: '영업이익', prev: parseNum(profitRow['3차년도 4분기']), curr: parseNum(profitRow['4차년도 1분기']) },
                { label: '당기순이익', prev: parseNum(netIncomeRow['3차년도 4분기']), curr: parseNum(netIncomeRow['4차년도 1분기']) }
            ];

            updateUI(metrics);
        }
    });

    function updateUI(metrics) {
        document.getElementById('update-date').innerText = "3차년도 4Q vs 4차년도 1Q 비교";
        
        const statsContainer = document.getElementById('stats');
        statsContainer.innerHTML = metrics.map(m => {
            const diff = ((m.curr - m.prev) / m.prev * 100).toFixed(1);
            const isUp = diff >= 0;
            return `
                <div class="stat-card">
                    <div class="stat-label">${m.label} (4차 1Q)</div>
                    <div class="stat-value">${formatNum(m.curr)}</div>
                    <div class="stat-diff ${isUp ? 'up' : 'down'}">
                        ${isUp ? '▲' : '▼'} ${Math.abs(diff)}% (전분기 대비)
                    </div>
                </div>
            `;
        }).join('');

        renderChart(metrics);
    }

    function renderChart(metrics) {
        const ctx = document.getElementById('compChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: metrics.map(m => m.label),
                datasets: [
                    {
                        label: '3차년도 4분기',
                        data: metrics.map(m => m.prev),
                        backgroundColor: '#cbd5e0'
                    },
                    {
                        label: '4차년도 1분기',
                        data: metrics.map(m => m.curr),
                        backgroundColor: '#4a90e2'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: {
                    y: { 
                        beginAtZero: true,
                        ticks: { callback: v => formatNum(v) }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
